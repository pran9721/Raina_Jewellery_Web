<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Addresses | RAINA JEWELS</title><link rel="stylesheet" href="extra-pages.css"></head><body><header class="top"><a class="logo" href="dashboard.html">RAINA<span> JEWELS</span></a><nav><a href="dashboard.html">Home</a><a href="shop.html">Shop</a><a href="cart.html">Cart</a><a href="wishlist.html">Wishlist</a><a href="orders.html">My Orders</a><a href="addresses.html">Addresses</a><a href="personal-information.html">Account</a></nav></header><main><section class="hero"><div class="eyebrow">My Account</div><h1>Saved Addresses</h1><p>Manage the delivery addresses linked to your RAINA JEWELS account.</p></section><section class="panel"><h2>Add a new address</h2><form id="addressForm"><div class="grid"><div class="field"><label>Recipient name</label><input name="recipient_name" required maxlength="100"></div><div class="field"><label>Mobile number</label><input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"></div></div><div class="field"><label>Full address</label><textarea name="address_line" required maxlength="500"></textarea></div><div class="grid"><div class="field"><label>Landmark (optional)</label><input name="landmark" maxlength="200"></div><div class="field"><label>PIN code</label><input name="pincode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></div><div class="field"><label>City</label><input name="city" required maxlength="100"></div><div class="field"><label>State</label><input name="state" required maxlength="100"></div></div><label style="font-size:13px"><input type="checkbox" name="is_default" value="1" checked> Set as default address</label><p><button class="btn" type="submit">Save Address</button></p><p class="notice" id="addressNotice" role="status"></p></form></section><section class="panel"><h2>Your saved addresses</h2><div id="addressList"><p class="notice">Loading addresses…</p></div></section></main><footer class="footer"><span>© 2026 RAINA JEWELS</span><div><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy-policy.html">Privacy</a><a href="terms.html">Terms</a><a href="shipping-policy.html">Shipping</a><a href="refund-policy.html">Returns & Refunds</a></div></footer><script src="api-client.js"></script><script>
const list=document.getElementById('addressList'),notice=document.getElementById('addressNotice');
async function loadAddresses(){try{const d=await RainaAPI.request('addresses');list.innerHTML=d.addresses.length?d.addresses.map(a=>`<article class="address-card"><span class="tag">${Number(a.is_default)?'DEFAULT':'SAVED ADDRESS'}</span><h3>${esc(a.recipient_name)} · ${esc(a.phone)}</h3><p>${esc(a.address_line)}${a.landmark?' · '+esc(a.landmark):''}</p><p>${esc(a.city)}, ${esc(a.state)} – ${esc(a.pincode)}</p><button class="btn secondary" data-delete-address="${a.id}">Remove</button></article>`).join(''):'<p class="notice">No saved addresses yet. Add one above.</p>'}catch(e){list.innerHTML='<p class="notice">'+esc(e.message)+' — please sign in first.</p>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('addressForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));d.is_default=!!f.elements.is_default.checked;notice.textContent='Saving…';try{const r=await RainaAPI.request('addresses',{method:'POST',body:d});notice.textContent=r.message;f.reset();f.elements.is_default.checked=true;await loadAddresses()}catch(err){notice.textContent=err.message}});
list.addEventListener('click',async e=>{const b=e.target.closest('[data-delete-address]');if(!b)return;if(!confirm('Remove this saved address?'))return;try{await RainaAPI.request('addresses',{method:'DELETE',query:'id='+encodeURIComponent(b.dataset.deleteAddress)});await loadAddresses()}catch(err){alert(err.message)}});loadAddresses();
</script></body></html>
