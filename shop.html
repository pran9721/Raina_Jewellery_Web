<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Jewellery | RAINA JEWELLERY</title>
<style>
:root{--rose:#b97887;--rose-dark:#965967;--ink:#292525;--muted:#777;--line:#eee7e5;--cream:#faf7f6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}
.shop-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header-inner{max-width:1320px;margin:auto;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:Georgia,serif;font-size:30px;letter-spacing:5px;color:var(--rose-dark);white-space:nowrap}
.brand small{display:block;font:9px Arial;letter-spacing:4px;text-align:center;margin-top:3px;color:#777}
.header-links{display:flex;gap:24px;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:15px}.header-actions a{font-size:13px}
.shop-hero{background:linear-gradient(110deg,#f6e9e9,#f9f4f0);padding:48px 24px;text-align:center}
.shop-hero p{letter-spacing:3px;text-transform:uppercase;font-size:11px;color:var(--rose-dark);margin:0 0 12px}
.shop-hero h1{font:42px Georgia,serif;font-weight:400;margin:0 0 12px}
.shop-hero span{font-size:14px;color:#716969}
.container{max-width:1320px;margin:auto;padding:34px 24px 70px}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:24px}
.category-strip{display:flex;gap:10px;overflow-x:auto;padding:3px 0 18px;margin-bottom:20px;scrollbar-width:thin}
.category-btn{flex:0 0 auto;border:1px solid #e6d8d8;background:#fff;color:#51494a;border-radius:30px;padding:11px 19px;cursor:pointer;transition:.2s;font-size:13px}
.category-btn:hover,.category-btn.active{background:var(--rose);border-color:var(--rose);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:15px 0 20px;margin-bottom:24px;flex-wrap:wrap}
.result-count{font-size:13px;color:var(--muted)}.toolbar-controls{display:flex;gap:10px;align-items:center}
.search-box,.sort-select{border:1px solid #e4dddd;border-radius:4px;padding:11px 13px;background:#fff;font-size:13px;outline-color:var(--rose)}
.search-box{width:230px}.sort-select{min-width:155px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:28px}
.filters{border:1px solid var(--line);padding:20px;height:max-content}
.filters h3{font:20px Georgia,serif;margin:0 0 20px}
.filter-group{padding:15px 0;border-top:1px solid var(--line)}
.filter-group h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 0 13px}
.filter-option{display:flex;align-items:center;gap:9px;font-size:13px;color:#5f5858;margin:11px 0;cursor:pointer}
.filter-option input{accent-color:var(--rose)}
.clear-btn{border:0;background:none;color:var(--rose-dark);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}
.product-card{min-width:0;position:relative}
.product-image{height:285px;background:linear-gradient(145deg,#f8f2f0,#eee5e2);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.product-card:hover .product-image img{transform:scale(1.05)}
.image-placeholder{font:16px Georgia,serif;color:#a58b8c;text-align:center;padding:20px}
.product-badge{position:absolute;top:12px;left:12px;background:#fff;padding:7px 9px;font-size:10px;letter-spacing:.5px}
.wishlist{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:#fff;font-size:19px;cursor:pointer;color:#6b5558}
.product-info{padding:13px 2px}
.product-category{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:7px}
.product-name{font:17px Georgia,serif;margin:0 0 8px;line-height:1.3}
.price-row{display:flex;gap:9px;align-items:center;font-size:14px}
.price{font-weight:bold}.old-price{color:#999;text-decoration:line-through;font-size:12px}.discount{color:#a35e6b;font-size:11px}
.add-cart{width:100%;margin-top:12px;padding:11px;border:1px solid var(--rose);background:#fff;color:var(--rose-dark);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s}
.add-cart:hover{background:var(--rose);color:#fff}
.empty-state{grid-column:1/-1;text-align:center;padding:70px 15px;color:var(--muted)}
.empty-state h3{font:25px Georgia,serif;color:var(--ink)}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:40px}
.pagination button{width:35px;height:35px;border:1px solid var(--line);background:white;cursor:pointer}.pagination button.active{background:var(--rose);color:#fff}
.shop-footer{background:#f7f3f1;text-align:center;padding:28px 15px;font-size:12px;color:#777}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#292525;color:white;padding:13px 22px;border-radius:4px;font-size:13px;transition:.3s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.filters{display:none}.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header-links{display:none}}
@media(max-width:560px){.header-inner{padding:13px 15px}.brand{font-size:23px}.header-actions{gap:9px}.header-actions a{font-size:11px}.shop-hero{padding:38px 15px}.shop-hero h1{font-size:32px}.container{padding:25px 14px 50px}.toolbar{align-items:flex-start}.toolbar-controls{width:100%}.search-box{flex:1;width:50%}.sort-select{flex:1;min-width:0}.products-grid{gap:20px 11px}.product-image{height:190px}.product-name{font-size:15px}.price-row{flex-wrap:wrap;gap:5px}.add-cart{padding:10px 5px;font-size:10px}}
</style>
<link rel="stylesheet" href="raina-signature-ui.css">
</head>
<body>
<header class="shop-header">
  <div class="header-inner">
    <a class="brand" href="index.html">RAINA<small>JEWELLERY</small></a>
    <nav class="header-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="#categories">Collections</a><a href="#">About</a></nav>
    <div class="header-actions"><a href="account.html">Account</a><a href="wishlist.html">♡ Wishlist</a><a href="cart.html">Bag (<span id="cartCount">0</span>)</a></div>
  </div>
</header>

<section class="shop-hero">
  <p>Discover your sparkle</p>
  <h1>Shop RAINA Jewellery</h1>
  <span>Timeless designs, made to make every moment special.</span>
</section>

<main class="container">
  <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Shop <span id="crumbCategory"></span></div>
  <div class="category-strip" id="categories">
    <button class="category-btn active" data-category="All">All Jewellery</button>
    <button class="category-btn" data-category="Rings">Rings</button>
    <button class="category-btn" data-category="Earrings">Earrings</button>
    <button class="category-btn" data-category="Pendants">Pendants</button>
    <button class="category-btn" data-category="Necklaces">Necklaces</button>
    <button class="category-btn" data-category="Bracelets">Bracelets</button>
    <button class="category-btn" data-category="Bangles">Bangles</button>
    <button class="category-btn" data-category="Chains">Chains</button>
    <button class="category-btn" data-category="Anklets">Anklets</button>
    <button class="category-btn" data-category="Jewellery Sets">Jewellery Sets</button>
<button class="category-btn" data-category="Men's Jewellery">Men's Jewellery</button>
  </div>

  <div class="toolbar">
    <div class="result-count" id="resultCount">Showing all products</div>
    <div class="toolbar-controls">
      <input class="search-box" id="searchInput" type="search" placeholder="Search jewellery...">
      <select class="sort-select" id="sortSelect" aria-label="Sort products">
        <option value="featured">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <aside class="filters">
      <h3>Filters</h3>
      <div class="filter-group">
        <h4>Category</h4>
        <label class="filter-option"><input type="checkbox" name="category" value="Rings"> Rings</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Earrings"> Earrings</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Pendants"> Pendants</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Necklaces"> Necklaces</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Bracelets"> Bracelets</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Bangles"> Bangles</label>
        <label class="filter-option"><input type="checkbox" name="category" value="Men's Jewellery"> Men's Jewellery</label>
      </div>
      <div class="filter-group">
        <h4>Price</h4>
        <label class="filter-option"><input type="radio" name="price" value="all" checked> All prices</label>
        <label class="filter-option"><input type="radio" name="price" value="under500"> Under ₹500</label>
        <label class="filter-option"><input type="radio" name="price" value="500to1000"> ₹500 – ₹1,000</label>
        <label class="filter-option"><input type="radio" name="price" value="1000to2000"> ₹1,000 – ₹2,000</label>
        <label class="filter-option"><input type="radio" name="price" value="above2000"> Above ₹2,000</label>
      </div>
      <button class="clear-btn" id="clearFilters">Clear all filters</button>
    </aside>

    <section>
      <div class="products-grid" id="productsGrid" aria-live="polite"></div>
      <div class="pagination" id="pagination"></div>
    </section>
  </div>
</main>

<footer class="shop-footer">© <span id="year"></span> RAINA JEWELLERY. All rights reserved.</footer>
<div class="toast" id="toast" role="status"></div>

<script src="api-client.js"></script>
<script>
/* Demo catalogue. Replace image URLs and product details with your own products. */
let products = [
 {id:1,name:"Dewdrop Solitaire Ring",category:"Rings",price:799,oldPrice:1199,badge:"BESTSELLER",image:""},
 {id:2,name:"Floral Bloom Stud Earrings",category:"Earrings",price:599,oldPrice:899,badge:"NEW",image:""},
 {id:3,name:"Classic Heart Pendant",category:"Pendants",price:699,oldPrice:999,badge:"",image:""},
 {id:4,name:"Celestial Layered Necklace",category:"Necklaces",price:1499,oldPrice:1999,badge:"TRENDING",image:""},
 {id:5,name:"Everyday Charm Bracelet",category:"Bracelets",price:899,oldPrice:1299,badge:"",image:""},
 {id:6,name:"Rose Glow Bangles",category:"Bangles",price:1299,oldPrice:1799,badge:"",image:""},
 {id:7,name:"Minimal Gold Band Ring",category:"Rings",price:499,oldPrice:699,badge:"",image:""},
 {id:8,name:"Pearl Drop Earrings",category:"Earrings",price:1099,oldPrice:1499,badge:"POPULAR",image:""},
 {id:9,name:"Moonstone Teardrop Pendant",category:"Pendants",price:1199,oldPrice:1599,badge:"",image:""},
 {id:10,name:"Silver Shine Chain",category:"Chains",price:599,oldPrice:799,badge:"",image:""},
 {id:11,name:"Dainty Floral Anklet",category:"Anklets",price:449,oldPrice:649,badge:"",image:""},
 {id:12,name:"Elegant Occasion Jewellery Set",category:"Jewellery Sets",price:2499,oldPrice:3299,badge:"",image:""},
 {id:13,name:"Twisted Elegance Ring",category:"Rings",price:999,oldPrice:1399,badge:"",image:""},
 {id:14,name:"Pearl Halo Necklace",category:"Necklaces",price:1899,oldPrice:2499,badge:"",image:""},
 {id:15,name:"Classic Hoop Earrings",category:"Earrings",price:749,oldPrice:999,badge:"",image:""},
{id:16,name:"Classic Men's Chain",category:"Men's Jewellery",price:1199,oldPrice:1599,badge:"",image:""},
{id:17,name:"Minimal Men's Bracelet",category:"Men's Jewellery",price:899,oldPrice:1299,badge:"NEW",image:""}
];
async function loadMySQLCatalogue(){
 try{const d=await RainaAPI.request("products");if(Array.isArray(d.products)&&d.products.length){products=d.products.map(p=>{let imgs=[];try{imgs=Array.isArray(p.image_urls)?p.image_urls:JSON.parse(p.image_urls||"[]")}catch(_){}return{id:p.slug||String(p.id),slug:p.slug||String(p.id),name:p.name,category:p.category_name||p.category||"Jewellery",price:Number(p.price),oldPrice:Number(p.mrp||p.price),badge:"",image:imgs[0]||""};});render();}}
 catch(e){console.warn("Using local demo catalogue until MySQL is connected:",e);}
}
const params = new URLSearchParams(window.location.search);
const categoryAliases = {
  "rings":"Rings", "bracelets":"Bracelets", "pendants":"Pendants",
  "earrings":"Earrings", "mens-jewellery":"Men's Jewellery",
  "anklets":"Anklets", "chains":"Chains", "sets":"Jewellery Sets",
  "necklaces":"Necklaces", "bangles":"Bangles"
};
const requestedCategory = params.get("category");
const initialCategory = requestedCategory
  ? (categoryAliases[requestedCategory.toLowerCase()] || requestedCategory)
  : "All";
const state={
  category: initialCategory,
  search: params.get("search") || "",
  sort: "featured",
  price: "all",
  checkedCategories: []
};
const grid=document.getElementById("productsGrid");
// Event delegation: works for products rendered from MySQL as well as demo products.
grid.addEventListener("click", function(event){
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const id = decodeURIComponent(button.dataset.productId || "");
  if (button.dataset.action === "add-cart") addToCart(id);
  if (button.dataset.action === "wishlist") toggleWishlist(id, button);
});
const count=document.getElementById("resultCount");
const pagination=document.getElementById("pagination");
let currentPage=1; const perPage=9;

function getFiltered(){
 let list=products.filter(p=>{
  const categoryMatch=state.category==="All"||p.category===state.category;
  const checksMatch=!state.checkedCategories.length||state.checkedCategories.includes(p.category);
  const searchMatch=(p.name+" "+p.category).toLowerCase().includes(state.search.toLowerCase());
  let priceMatch=true;
  if(state.price==="under500")priceMatch=p.price<500;
  if(state.price==="500to1000")priceMatch=p.price>=500&&p.price<=1000;
  if(state.price==="1000to2000")priceMatch=p.price>1000&&p.price<=2000;
  if(state.price==="above2000")priceMatch=p.price>2000;
  return categoryMatch&&checksMatch&&searchMatch&&priceMatch;
 });
 if(state.sort==="low")list.sort((a,b)=>a.price-b.price);
 if(state.sort==="high")list.sort((a,b)=>b.price-a.price);
 if(state.sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name));
 return list;
}
function render(){
 const list=getFiltered(), pages=Math.max(1,Math.ceil(list.length/perPage));
 currentPage=Math.min(currentPage,pages);
 const visible=list.slice((currentPage-1)*perPage,currentPage*perPage);
 count.textContent=`Showing ${list.length?((currentPage-1)*perPage+1):0}–${Math.min(currentPage*perPage,list.length)} of ${list.length} products`;
 document.getElementById("crumbCategory").textContent=state.category==="All"?"": " / "+state.category;
 grid.innerHTML=visible.length?visible.map(p=>`
  <article class="product-card">
   <div class="product-image">
    ${p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy">`:`<div class="image-placeholder">${p.category}<br><small>Product image</small></div>`}
    ${p.badge?`<span class="product-badge">${p.badge}</span>`:""}
    <button class="wishlist" aria-label="Add ${p.name} to wishlist" data-action="wishlist" data-product-id="${encodeURIComponent(String(p.id))}">♡</button>
   </div>
   <div class="product-info">
    <div class="product-category">${p.category}</div>
    <h3 class="product-name">${p.name}</h3>
    <div class="price-row"><span class="price">₹${p.price.toLocaleString("en-IN")}</span><span class="old-price">₹${p.oldPrice.toLocaleString("en-IN")}</span><span class="discount">${Math.round((1-p.price/p.oldPrice)*100)}% OFF</span></div>
    <button class="add-cart" type="button" data-action="add-cart" data-product-id="${encodeURIComponent(String(p.id))}">Add to bag</button>
   </div>
  </article>`).join(""):`<div class="empty-state"><h3>No jewellery found</h3><p>Try another category or clear your filters.</p></div>`;
 pagination.innerHTML=pages>1?Array.from({length:pages},(_,i)=>`<button class="${currentPage===i+1?"active":""}" onclick="goPage(${i+1})">${i+1}</button>`).join(""):"";
}
function goPage(page){currentPage=page;render();window.scrollTo({top:document.querySelector(".toolbar").offsetTop-80,behavior:"smooth"});}
document.querySelectorAll(".category-btn").forEach(btn=>btn.addEventListener("click",()=>{
 state.category=btn.dataset.category;currentPage=1;
 document.querySelectorAll(".category-btn").forEach(b=>b.classList.toggle("active",b===btn));
 document.querySelectorAll('input[name="category"]').forEach(c=>c.checked=false);
 state.checkedCategories=[];render();
}));
document.getElementById("searchInput").addEventListener("input",e=>{state.search=e.target.value;currentPage=1;render();});
document.getElementById("sortSelect").addEventListener("change",e=>{state.sort=e.target.value;render();});
document.querySelectorAll('input[name="category"]').forEach(c=>c.addEventListener("change",()=>{
 state.category="All";document.querySelectorAll(".category-btn").forEach(b=>b.classList.toggle("active",b.dataset.category==="All"));
 state.checkedCategories=[...document.querySelectorAll('input[name="category"]:checked')].map(x=>x.value);currentPage=1;render();
}));
document.querySelectorAll('input[name="price"]').forEach(r=>r.addEventListener("change",()=>{state.price=r.value;currentPage=1;render();}));
document.getElementById("clearFilters").addEventListener("click",()=>{
 state.category="All";state.search="";state.sort="featured";state.price="all";state.checkedCategories=[];currentPage=1;
 document.getElementById("searchInput").value="";document.getElementById("sortSelect").value="featured";
 document.querySelectorAll('input[name="category"],input[name="price"]').forEach(x=>x.checked=x.value==="all");
 document.querySelectorAll(".category-btn").forEach(b=>b.classList.toggle("active",b.dataset.category==="All"));render();
});
function showToast(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function addToCart(id){
  try {
    const product = products.find(item => String(item.id) === String(id) || String(item.slug) === String(id));
    if (!product) {
      console.error("Add to cart: product not found", { id, products });
      showToast("Product not found. Refresh the shop page and try again.");
      return;
    }
    let cart = JSON.parse(localStorage.getItem("rainaCart") || "[]");
    if (!Array.isArray(cart)) cart = [];
    const key = String(product.id);
    const existing = cart.find(item => String(item.id) === key || String(item.slug) === String(product.slug || key));
    if (existing) {
      existing.qty = Number(existing.qty || existing.quantity || 1) + 1;
      existing.quantity = existing.qty;
    } else {
      cart.push({ ...product, id: product.id, qty: 1, quantity: 1 });
    }
    localStorage.setItem("rainaCart", JSON.stringify(cart));
    window.dispatchEvent(new CustomEvent("raina-store-updated"));
    updateCartCount();
    showToast(product.name + " added to your bag");
    console.log("RAINA cart saved:", cart);
  } catch (error) {
    console.error("Add to cart failed:", error);
    showToast("Could not add product. Check browser console.");
  }
}

window.addToCart = addToCart;
function updateCartCount(){const cart=JSON.parse(localStorage.getItem("rainaCart")||"[]");document.getElementById("cartCount").textContent=cart.reduce((s,p)=>s+(p.qty||p.quantity||1),0);}
function toggleWishlist(id,button){
 let list=JSON.parse(localStorage.getItem("rainaWishlist")||"[]");
 if(list.includes(id)){list=list.filter(x=>x!==id);button.textContent="♡";showToast("Removed from wishlist");}
 else{list.push(id);button.textContent="♥";showToast("Added to wishlist");}
 localStorage.setItem("rainaWishlist",JSON.stringify(list));window.dispatchEvent(new CustomEvent("raina-store-updated"));
}
document.getElementById("year").textContent=new Date().getFullYear();
document.getElementById("searchInput").value = state.search;
document.querySelectorAll(".category-btn").forEach(btn => {
  btn.classList.toggle("active", btn.dataset.category === state.category);
});
updateCartCount();render();loadMySQLCatalogue();
</script>
</body>
</html>
