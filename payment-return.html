<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAINA JEWELS | Payment status</title><link rel="stylesheet" href="checkout.css"><style>body{font:16px Arial,sans-serif;background:#fff7f1;color:#30241e;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:36px;border-radius:16px;max-width:520px;width:calc(100% - 48px);box-shadow:0 10px 40px #0001;text-align:center}h1{font-family:Georgia,serif}p{line-height:1.6;color:#6f6259}a{display:inline-block;margin-top:18px;padding:12px 20px;background:#29201c;color:white;text-decoration:none;border-radius:8px}</style></head><body><main class="card"><h1 id="title">Checking your payment…</h1><p id="detail">Please wait while RAINA JEWELS verifies your payment directly with Cashfree.</p><a href="dashboard.html">Continue to RAINA JEWELS</a></main><script src="api-client.js"></script><script>
(async()=>{const p=new URLSearchParams(location.search),id=p.get('order_id');const title=document.getElementById('title'),detail=document.getElementById('detail');if(!id){title.textContent='Order reference missing';detail.textContent='Please contact RAINA JEWELS support with your payment reference.';return;}try{const d=await RainaAPI.request('cashfree-verify',{method:'POST',body:{order_id:id}});if(d.paid){title.textContent='Payment successful';detail.textContent='Cashfree confirms that your RAINA JEWELS order '+id+' is PAID.';localStorage.removeItem('rainaCart');localStorage.removeItem('rainaCoupon');sessionStorage.removeItem('rainaCheckoutSnapshot');}else{title.textContent='Payment not confirmed';detail.textContent='Current Cashfree status: '+d.order_status+'. Your order is saved as pending. Do not retry until you check your bank/payment app.';}}catch(e){title.textContent='Payment status pending verification';detail.textContent=e.message+' If money was debited, do not pay again; contact RAINA JEWELS support.';}})();
</script></body></html>
