<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | RAINA JEWELS</title>
<link rel="stylesheet" href="account-pages.css"><link rel="stylesheet" href="raina-signature-ui.css">
<style>
:root{--pink:#c77f91;--pink-dark:#a85f73;--ink:#282323;--muted:#817779;--line:#eee4e6;--cream:#fff8f6;--green:#229b68}
*{box-sizing:border-box}body{margin:0;background:#faf8f7;color:var(--ink);font-family:Arial,sans-serif}
.orders-shell{max-width:1120px;margin:38px auto;padding:0 22px}.topline{display:flex;align-items:center;gap:15px;margin-bottom:24px}.back{color:#75676b;text-decoration:none;font-size:14px}.heading h1{font:500 32px Georgia,serif;margin:0}.heading p{margin:7px 0 0;color:var(--muted);font-size:14px}
.orders-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.orders-list{display:grid;gap:13px}.order-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:0 5px 18px #37252b08;transition:.2s}.order-card:hover{border-color:#e1b8c2;box-shadow:0 8px 24px #37252b10}
.order-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.order-id{font-size:14px;font-weight:700}.order-date{font-size:12px;color:var(--muted);margin-top:6px}.order-products{font-size:12px;color:#8b6973;margin-top:7px;line-height:1.5}.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cancel-btn{border:1px solid #e7b6bd;background:#fff;color:#bf5664;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}.cancel-btn:hover{background:#fff2f3}.status{display:inline-flex;align-items:center;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:700;text-transform:capitalize;white-space:nowrap;background:#fff2d8;color:#a56b14}.status.delivered,.status.paid{background:#e5f7ef;color:#168454}.status.cancelled,.status.rejected,.status.failed{background:#ffeded;color:#d04d55}.status.shipped,.status.processing,.status.confirmed{background:#eaf1ff;color:#3f69bd}
.order-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px;padding-top:14px;border-top:1px solid #f2edef}.order-summary{font-size:13px;color:#62585b}.order-summary strong{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}.view-btn{border:0;border-radius:8px;background:var(--pink);color:#fff;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer}.view-btn:hover{background:var(--pink-dark)}
.side-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;position:sticky;top:20px}.side-card h3{font:22px Georgia,serif;margin:0 0 14px}.side-card p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.empty{background:#fff;border:1px dashed #e4cbd1;border-radius:15px;padding:45px 20px;text-align:center;color:var(--muted)}.empty .bag{font-size:35px;margin-bottom:12px}.empty h2{font:24px Georgia,serif;color:var(--ink);margin:0 0 8px}.shop-link{display:inline-block;margin-top:15px;background:var(--pink);color:white;padding:11px 18px;border-radius:8px;text-decoration:none;font-size:13px}
.modal-backdrop{display:none;position:fixed;inset:0;background:#17111688;z-index:1000;padding:22px;overflow:auto}.modal-backdrop.open{display:flex;justify-content:center;align-items:flex-start}.detail-panel{background:#fff;width:min(720px,100%);margin:20px auto;border-radius:17px;overflow:hidden;box-shadow:0 20px 60px #0003}.detail-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.detail-head h2{font:25px Georgia,serif;margin:0}.close-btn{border:0;background:#f8eff1;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;color:#805b65}.detail-body{padding:22px 23px}.detail-meta{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:17px}.detail-meta small{display:block;color:var(--muted);margin-top:5px}.invoice-btn{border:1px solid #e4aebc;color:var(--pink-dark);background:#fff;border-radius:7px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}.detail-items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;display:grid;gap:12px}.detail-item{display:flex;justify-content:space-between;gap:12px;font-size:13px}.detail-item span{color:var(--muted)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.info-box{background:#fff9f8;border:1px solid #f3e8e9;border-radius:10px;padding:14px}.info-box h4{font-size:12px;margin:0 0 9px;color:#a66b7a;text-transform:uppercase;letter-spacing:.6px}.info-box p{font-size:13px;line-height:1.65;margin:0;color:#554b4e;overflow-wrap:anywhere}.tracking-box{margin:18px 0;padding:17px;border:1px solid #eee1e5;border-radius:12px;background:#fffafb}.tracking-title{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tracking-title strong{font-size:14px}.tracking-title small{color:var(--muted)}.track-line{display:flex;align-items:center;gap:0;margin:20px 0 8px}.track-step{flex:1;position:relative;text-align:center;font-size:10px;color:#8d8286}.track-step:before{content:"";display:block;width:17px;height:17px;border-radius:50%;margin:0 auto 7px;background:#ddd4dc;position:relative;z-index:2}.track-step:not(:last-child):after{content:"";position:absolute;top:7px;left:50%;width:100%;height:4px;background:#ddd4dc}.track-step.done{color:#4a2450;font-weight:700}.track-step.done:before,.track-step.done:not(:last-child):after{background:#6934ed}.otp-card{margin-top:14px;padding:14px;border-radius:10px;background:#f2edff;border:1px solid #d9ccff}.otp-card strong{display:block;font-size:26px;letter-spacing:7px;color:#5424c8;margin-top:6px}.otp-card small{color:#6d5b8e;line-height:1.5}.totals{margin:16px 0 0 auto;max-width:260px}.total-line{display:flex;justify-content:space-between;font-size:13px;margin:7px 0;color:#71676a}.total-line.grand{font-weight:700;color:var(--ink);font-size:16px;border-top:1px solid var(--line);padding-top:10px}
@media(max-width:780px){.orders-shell{margin:23px auto;padding:0 14px}.orders-layout{grid-template-columns:1fr}.side-card{position:static}.heading h1{font-size:28px}.order-card{padding:15px}.order-bottom{align-items:flex-end}.detail-grid{grid-template-columns:1fr}.modal-backdrop{padding:8px}.detail-panel{margin:8px auto}.detail-body{padding:17px}.detail-head{padding:16px 17px}.detail-meta{align-items:flex-start;flex-wrap:wrap}}
@media print{body *{visibility:hidden!important}.detail-panel,.detail-panel *{visibility:visible!important}.modal-backdrop{display:block!important;position:absolute;inset:0;background:#fff;padding:0}.detail-panel{box-shadow:none;margin:0;width:100%;border:0}.close-btn,.invoice-btn{display:none!important}}
</style></head>
<body>
<main class="orders-shell">
  <div class="topline"><a class="back" href="dashboard.html">← Back</a><div class="heading"><h1>My Orders</h1><p>Track your purchases and view order details.</p></div></div>
  <div class="orders-layout"><section><div id="ordersList" class="orders-list"><div class="empty">Loading your orders…</div></div></section>
  <aside class="side-card"><h3>Need help?</h3><p>For questions about your order, delivery or payment, contact the RAINA JEWELS support team. Keep your order number handy so we can help faster.</p><a class="shop-link" href="contact.html">Contact Support</a></aside></div>
</main>
<div class="modal-backdrop" id="detailModal" aria-hidden="true"><section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><header class="detail-head"><h2 id="detailTitle">Order Details</h2><button class="close-btn" id="closeDetail" aria-label="Close">×</button></header><div class="detail-body" id="detailBody"></div></section></div>
<script src="api-client.js"></script>
<script>
(()=>{
const root=document.getElementById('ordersList'),modal=document.getElementById('detailModal'),body=document.getElementById('detailBody');
let orders=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>{const d=new Date(v);return isNaN(d)?'Date unavailable':d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});};
const pill=v=>{const s=String(v||'Pending').toLowerCase();return `<span class="status ${esc(s)}">${esc(v||'Pending')}</span>`;};
function render(){if(!orders.length){root.innerHTML='<div class="empty"><div class="bag">♡</div><h2>No orders yet</h2><p>Your placed orders will appear here.</p><a class="shop-link" href="shop.html">Explore Jewellery</a></div>';return;}
root.innerHTML=orders.map((o,i)=>`<article class="order-card"><div class="order-top"><div><div class="order-id">Order ID: #${esc(o.order_number||o.id)}</div><div class="order-products">${(o.items||[]).map(it=>esc(it.product_name)).join(' · ') || 'Product details unavailable'}</div><div class="order-date">● &nbsp;Order at ${esc(date(o.created_at))}</div></div>${pill(o.order_status)}</div><div class="order-bottom"><div class="order-summary"><strong>${money(o.total)}</strong>${(o.items||[]).length} item(s) &nbsp;·&nbsp; Payment: ${esc(o.payment_status||'Pending')}</div><div class="order-actions"><button class="view-btn" data-index="${i}">View Details&nbsp; →</button>${['Pending','Processing'].includes(o.order_status)?`<button class="cancel-btn" data-cancel="${esc(o.id)}">Cancel Order</button>`:''}</div></div></article>`).join('');
root.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>show(orders[Number(b.dataset.index)])));
root.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',async()=>{
 const order=orders.find(x=>String(x.id)===String(b.dataset.cancel)); if(!order)return;
 if(!confirm(`Cancel order #${order.order_number||order.id}? This action cannot be undone.`))return;
 b.disabled=true;b.textContent='Cancelling…';
 try{const r=await RainaAPI.request('order-cancel',{method:'PATCH',body:{id:Number(order.id)}});alert(r.message+(r.payment_note?'\\n'+r.payment_note:''));const d=await RainaAPI.request('orders');orders=d.orders||[];render();}
 catch(e){alert(e.message);b.disabled=false;b.textContent='Cancel Order';}
}));
}
function show(o){document.getElementById('detailTitle').textContent='Order Details';const items=o.items||[];
body.innerHTML=`<div class="detail-meta"><div><strong>Order ID: #${esc(o.order_number||o.id)}</strong><small>● &nbsp;Order at ${esc(date(o.created_at))}</small><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">${pill(o.order_status)}${pill(o.payment_status)}</div></div><button class="invoice-btn" id="invoiceBtn">Download invoice ↓</button></div>
${o.order_status!=='Pending'&&o.order_status!=='Cancelled'?`<div class="tracking-box"><div class="tracking-title"><strong>Order tracking</strong><small>${o.expected_delivery?'Expected delivery: '+esc(o.expected_delivery):'Delivery updates'}</small></div><div class="track-line">${['Processing','Shipped','Delivered'].map((st,i)=>`<div class="track-step ${(['Processing','Shipped','Delivered'].indexOf(o.order_status)>=i)?'done':''}">${['Order Processed','Order Shipped','Order Arrived'][i]}</div>`).join('')}</div>${o.tracking_number?`<small>Tracking ID: <b>${esc(o.tracking_number)}</b></small>`:''}${o.order_status==='Shipped'&&o.delivery_otp?`<div class="otp-card"><small>DELIVERY OTP — share this code with the delivery person only when your parcel arrives.</small><strong>${esc(o.delivery_otp)}</strong><small>Once the correct OTP is verified by the store, your order will be marked Delivered.</small></div>`:''}${o.order_status==='Delivered'?'<p style="color:#168454;font-weight:700;margin-top:10px">✓ Delivered — OTP verified</p>':''}</div>`:''}
<div class="detail-items">${items.length?items.map(it=>`<div class="detail-item"><div><strong>${esc(it.product_name)}</strong><br><span>Quantity: ${esc(it.quantity)} × ${money(it.unit_price)}</span></div><strong>${money(it.line_total)}</strong></div>`).join(''):'<p>No item details available.</p>'}</div>
<div class="detail-grid"><div class="info-box"><h4>Customer</h4><p><strong>${esc(o.customer_name)}</strong><br>${esc(o.phone)}<br>${esc(o.email)}</p></div><div class="info-box"><h4>Shipping Address</h4><p>${esc(o.address)}${o.landmark?'<br>'+esc(o.landmark):''}<br>${esc(o.city)}, ${esc(o.state)} – ${esc(o.pincode)}</p></div><div class="info-box"><h4>Payment</h4><p>${esc(o.payment_method)}<br>Status: ${esc(o.payment_status)}</p></div><div class="info-box"><h4>Order Note</h4><p>${esc(o.delivery_note||'No special instructions')}</p></div></div>
<div class="totals"><div class="total-line"><span>Subtotal</span><strong>${money(o.subtotal)}</strong></div><div class="total-line"><span>Shipping</span><strong>${money(o.shipping)}</strong></div><div class="total-line"><span>Discount</span><strong>− ${money(o.discount)}</strong></div><div class="total-line grand"><span>Order Total</span><strong>${money(o.total)}</strong></div></div>`;
document.getElementById('invoiceBtn').addEventListener('click',()=>window.print());modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
function close(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
document.getElementById('closeDetail').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close();});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
(async()=>{try{const d=await RainaAPI.request('orders');orders=d.orders||[];render();}catch(e){root.innerHTML=`<div class="empty"><h2>Sign in to view orders</h2><p>${esc(e.message||'Please log in to continue.')}</p><a class="shop-link" href="login.html">Login</a></div>`;}})();
})();
</script></body></html>
